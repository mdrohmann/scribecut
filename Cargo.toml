[package]
name = "scribecut"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
gst = { package = "gstreamer", version = "0.25.4" }
gst-app = { package = "gstreamer-app", version = "0.25.2" }
gst-video = { package = "gstreamer-video", version = "0.25.4" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
ureq = "3.4.2"
whisper-rs = "0.16.0"

# ONNX Runtime, linked in statically: runs MODNet, the person-cutout model
# (see src/cutout/modnet.rs). macOS has Vision for that instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-24"] }

# The ScreenCast portal (PipeWire) is how Linux desktops hand out screen frames.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "sync"] }

# macOS: CoreGraphics for the window/display list, AppKit to raise a window's app.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.1", default-features = false, features = ["std", "NSRunningApplication", "libc"] }
# Vision cuts the person out of the camera picture (see src/cutout/vision.rs),
# through CoreVideo pixel buffers.
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn",
] }
objc2-foundation = { version = "0.3.1", default-features = false, features = ["std", "NSArray"] }
objc2-vision = { version = "0.3.2", default-features = false, features = [
    "std", "objc2-core-video", "VNRequest", "VNStatefulRequest", "VNRequestHandler",
    "VNGeneratePersonSegmentationRequest", "VNObservation",
] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
